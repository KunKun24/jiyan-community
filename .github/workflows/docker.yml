name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: web
            dockerfile: web/Dockerfile
          - image: server
            dockerfile: server/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (web, amd64)
        if: matrix.image == 'web'
        run: |
          docker build -f web/Dockerfile -t shequ-web:smoke .
          docker run -d --name shequ-web-smoke --add-host server:127.0.0.1 -p 18080:80 shequ-web:smoke
          sleep 3
          body=$(curl -s http://127.0.0.1:18080/ || true)
          echo "$body" | head -5
          echo "$body" | grep -q '<div id="app"' || { docker logs shequ-web-smoke; exit 1; }
          docker rm -f shequ-web-smoke
